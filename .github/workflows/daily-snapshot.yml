name: Daily ADP snapshot

on:
  schedule:
    - cron: "7 13 * * *" # 9:07 AM ET during EDT
  workflow_dispatch:

env:
  SLEEPER_LEAGUE_ID: "1384188162011566080"
  LEAGUE_TEAMS: "10"
  ADP_FORMAT: half-ppr
  FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: python scripts/fetch_adp.py
      - run: python scripts/sleeper_sync.py
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily snapshot $(date -u +%F)"
          git push
